<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Stránka nenalezena | NationCraft.cz</title>
    <link rel="icon" type="image/png" href="./logo.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #0a0e1a;
            color: white;
            overflow-x: hidden;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes glow {
            0%, 100% { opacity: 0.15; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.2); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        
        .animate-glow {
            animation: glow 15s ease-in-out infinite;
        }
        
        .animate-pulse-slow {
            animation: pulse 2s ease-in-out infinite;
        }
        
        .hover-scale {
            transition: transform 0.2s ease;
        }
        
        .hover-scale:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center relative overflow-hidden px-6">
        <div class="absolute inset-0">
            <div class="absolute inset-0 bg-[#0a0e1a]"></div>
            <div class="absolute inset-0 opacity-50">
                <img src="./background.png" alt="Background" class="w-full h-full object-cover">
            </div>
            <div class="absolute inset-0 bg-gradient-to-b from-[#0a0e1a]/30 via-[#0a0e1a]/50 to-[#0a0e1a]"></div>
            
            <div class="absolute inset-0 opacity-5" style="background-image: linear-gradient(rgba(59,130,246,0.15) 1px, transparent 1px), linear-gradient(90deg, rgba(59,130,246,0.15) 1px, transparent 1px); background-size: 80px 80px; transform: rotate(-3deg) scale(1.2);"></div>

            <div class="absolute top-1/3 left-1/4 w-[600px] h-[600px] rounded-full bg-green-500/10 blur-[120px] animate-glow"></div>
            <div class="absolute bottom-1/3 right-1/4 w-[550px] h-[550px] rounded-full bg-emerald-500/10 blur-[120px] animate-glow" style="animation-delay: 2s;"></div>
        </div>

        <div class="absolute right-0 top-0 bottom-0 hidden lg:flex items-center justify-end pr-12 z-20">
            <img src="./skin.webp" alt="Minecraft Skin" class="h-full max-h-[80vh] w-auto object-contain drop-shadow-2xl opacity-90">
        </div>

        <div class="relative z-10 text-center max-w-2xl mx-auto">
            <div class="mb-8">
                <div class="inline-block p-6 rounded-3xl bg-red-500/10 border border-red-500/20 backdrop-blur-xl shadow-2xl">
                    <i class="fas fa-exclamation-triangle text-6xl text-red-400 animate-pulse-slow"></i>
                </div>
            </div>

            <h1 class="text-7xl md:text-9xl font-black mb-6 text-white drop-shadow-2xl animate-fade-in">
                404
            </h1>

            <h2 class="text-2xl md:text-4xl font-bold mb-4 text-white animate-fade-in" style="animation-delay: 0.2s; opacity: 0;">
                Stránka nenalezena
            </h2>

            <p class="text-lg md:text-xl text-gray-300 mb-12 leading-relaxed animate-fade-in drop-shadow-lg" style="animation-delay: 0.4s; opacity: 0;">
                Omlouváme se, ale stránka kterou hledáte neexistuje nebo byla přesunuta.
            </p>

            <a href="./index.html" class="inline-flex items-center gap-4 px-8 py-5 rounded-3xl backdrop-blur-xl bg-black/40 border border-white/20 hover:border-green-500/40 hover:bg-black/50 transition-all shadow-2xl hover-scale animate-fade-in" style="animation-delay: 0.6s; opacity: 0;">
                <div class="w-12 h-12 rounded-2xl bg-green-500/20 backdrop-blur-sm flex items-center justify-center border border-green-500/30">
                    <i class="fas fa-home text-green-400 text-xl"></i>
                </div>
                <div class="text-left">
                    <p class="text-xs text-gray-400 mb-1">Zpět na</p>
                    <p class="font-bold text-green-400 text-lg">Domovskou stránku</p>
                </div>
            </a>

            <div class="mt-16 animate-fade-in" style="animation-delay: 0.8s; opacity: 0;">
                <p class="text-sm text-gray-500 mb-4">Potřebujete pomoc?</p>
                <div class="flex justify-center gap-4">
                    <a href="https://discord.com/invite/SwMwGXY6au" target="_blank" class="p-4 rounded-2xl backdrop-blur-xl bg-black/40 border border-white/20 hover:border-green-500/40 hover:bg-black/50 transition-all shadow-2xl hover-scale">
                        <i class="fab fa-discord text-2xl text-gray-400 hover:text-green-400 transition-colors"></i>
                    </a>
                    <a href="https://www.instagram.com/nationcraft.cz/" target="_blank" class="p-4 rounded-2xl backdrop-blur-xl bg-black/40 border border-white/20 hover:border-green-500/40 hover:bg-black/50 transition-all shadow-2xl hover-scale">
                        <i class="fab fa-instagram text-2xl text-gray-400 hover:text-green-400 transition-colors"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.animate-fade-in').forEach((el, index) => {
            setTimeout(() => {
                el.style.opacity = '1';
            }, 100);
        });
    </script>
</body>
</html>
