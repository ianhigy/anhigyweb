<!DOCTYPE html>

    <!-- Tailwind CSS -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="https://unpkg.com/framer-motion@11/dist/framer-motion.js"></script>

    <style>

            padding: 0;

        body {

            background: #0a1208;
            color: white;
            overflow-x: hidden;
        }
        
        .prose p {
            margin-bottom: 1rem;
        }
        
        /* Dialog Overlay */
        .dialog-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);

            align-items: center;
            justify-content: center;
            padding: 1rem;

            border: 1px solid rgba(255, 255, 255, 0.1);

            overflow-y: auto;
            width: 100%;
            position: relative;
        }
        
        /* Scrollbar Styling */
        .dialog-content::-webkit-scrollbar {
            width: 8px;
        }
        
        .dialog-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        .dialog-content::-webkit-scrollbar-thumb {
            background: rgba(34, 197, 94, 0.3);
            border-radius: 10px;
        }
        
        .dialog-content::-webkit-scrollbar-thumb:hover {
            background: rgba(34, 197, 94, 0.5);
        }

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = window.Motion;

        // News Data
        const newsData = [
          {
            id: 1,
            title: 'OTEVŘENÍ SERVERU',
            excerpt: 'Server otevřený! Připoj se a užij si zábavu s ostatními hráči!',

            date: '1.1.2026',
            type: 'Oznámení',
            author: 'Admin Team',
            readTime: '2 min',
            image: null
          },
          {
            id: 2,
            title: 'DUELOVACÍ SYSTÉM',
            excerpt: 'Nový duelovací systém je k dispozici! Vyzvi své přátele na souboj.',
            content: 'Jsme nadšení, že vám můžeme představit náš nový duelovací systém! Tento systém nabízí napínavé 1v1 souboje s různými režimy a mapami.\n\nFunkce:\n- Více herních módů\n- Žebříčky nejlepších hráčů\n- Rankované i neranké zápasy\n- Statistiky a sledování pokroku\n\nVyzvi své přátele nebo se pusť do rankovaných zápasů a dokaž, že jsi ten nejlepší!',
            date: '1.1.2026',
            type: 'Novinka',
            author: 'Itz_Anhigy',
            readTime: '3 min',
            image: 'https://cdn.discordapp.com/attachments/1445486597578555646/1456755227440185364/IMG_2819.png?ex=69598487&is=69583307&hm=f3fc057bd41298b86b26c8d9f3f161ed496034327717292ec9625801c2fb58b0&'
          },
          {
            id: 3,
            title: 'HLASOVÁNÍ O EVENTECH',
            excerpt: 'Hlasuj o tom, jaké eventy chceš vidět na serveru! Tvůj hlas rozhoduje.',
            content: 'Tvůj názor je pro nás důležitý! Chceme vytvořit server, který bude plně odpovídat vašim přáním.\n\nHlasuj o:\n- Typech eventů\n- Odměnách\n- Termínech konání\n- A mnohem více!\n\nKaždý hlas se počítá. Zapoj se do našeho Discord serveru a řekni nám, co by ses chtěl vidět!',
            date: '1.1.2026',
            type: 'Event',
            author: 'Community Manager',
            readTime: '2 min',
            image: null
          }
        ];

        // Hero Section Component
        function HeroSection() {
            const [copied, setCopied] = useState(false);
            const [scrolled, setScrolled] = useState(false);
            const [playerCount, setPlayerCount] = useState(0);

            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            useEffect(() => {
                const fetchPlayers = async () => {
                    try {
                        const res = await fetch('https://api.mcsrvstat.us/3/alpha.argonix.eu:26217');
                        const data = await res.json();
                        if (data.online && data.players) {
                            setPlayerCount(data.players.online || 0);
                        }
                    } catch (error) {
                        console.error('Failed to fetch player count');
                    }
                };
                fetchPlayers();
                const interval = setInterval(fetchPlayers, 60000);
                return () => clearInterval(interval);
            }, []);

            const copyIP = (ip) => {
                navigator.clipboard.writeText(ip);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            return (
                <section className="relative min-h-screen flex items-center justify-center overflow-hidden">
                    <div className="absolute inset-0">
                        <div className="absolute inset-0 bg-[#0a1208]" />
                        <div className="absolute inset-0 opacity-70">
                            <img 
                                src="https://cdn.discordapp.com/attachments/1445486597578555646/1456755226953519295/IMG_2817.png?ex=69598487&is=69583307&hm=ed3b6811498a765b6181102aff942db03f03c349b31c5024819dde5ee9778c75&"
                                alt="Background"
                                className="w-full h-full object-cover"
                            />
                        </div>
                        <div className="absolute inset-0 bg-gradient-to-b from-[#0a1208]/30 via-[#0a1208]/50 to-[#0a1208]" />
                        
                        <div className="absolute inset-0 opacity-5">
                            <div className="absolute inset-0" style={{
                                backgroundImage: 'linear-gradient(rgba(34,197,94,0.15) 1px, transparent 1px), linear-gradient(90deg, rgba(234,179,8,0.15) 1px, transparent 1px)',
                                backgroundSize: '80px 80px',
                                transform: 'rotate(-3deg) scale(1.2)'
                            }} />
                        </div>

                        <motion.div
                            className="absolute top-1/3 left-1/4 w-[600px] h-[600px] rounded-full bg-green-500/8 blur-[120px]"
                            animate={{ 
                                x: [0, 50, 0],
                                y: [0, -30, 0],
                                scale: [1, 1.2, 1], 
                                opacity: [0.15, 0.3, 0.15] 
                            }}
                            transition={{ duration: 15, repeat: Infinity, ease: "easeInOut" }}
                        />
                        <motion.div
                            className="absolute bottom-1/3 right-1/4 w-[550px] h-[550px] rounded-full bg-yellow-500/8 blur-[120px]"
                            animate={{ 
                                x: [0, -60, 0],
                                y: [0, 40, 0],
                                scale: [1.2, 1, 1.2], 
                                opacity: [0.15, 0.3, 0.15] 
                            }}
                            transition={{ duration: 18, repeat: Infinity, ease: "easeInOut" }}
                        />
                    </div>

                    {/* Navigation */}
                    <motion.nav 
                        className={`fixed top-0 left-0 right-0 z-50 px-6 transition-all duration-500 ${scrolled ? 'py-2' : 'py-6'}`}
                        initial={{ opacity: 0, y: -20 }}
                        animate={{ opacity: 1, y: 0 }}
                    >
                        <div className={`max-w-7xl mx-auto flex items-center justify-between backdrop-blur-xl bg-white/5 border border-white/10 shadow-2xl transition-all duration-500 ${scrolled ? 'rounded-full px-6 py-3' : 'rounded-3xl px-8 py-4'}`}>
                            <div className="flex items-center gap-3">
                                <img 
                                    src="https://cdn.discordapp.com/attachments/1456694544983785563/1456762557275836477/IMG_2123.png?ex=69598b5a&is=695839da&hm=7629f737210a71d3d5db79705518c02fb1ab59a4aeae8867e217a3cbb6487621"
                                    alt="NationCraft"
                                    className="rounded-xl object-cover"
                                    style={{ width: scrolled ? 40 : 48, height: scrolled ? 40 : 48 }}
                                />
                                <span className={`font-bold text-white ${scrolled ? 'text-base' : 'text-xl'}`}>
                                    NationCraft
                                </span>
                            </div>

                            <div className="hidden md:flex items-center gap-8">
                                {['Domů', 'Tým', 'Pravidla', 'Hlasování', 'Nábory', 'Store'].map((item) => (
                                    <a 
                                        key={item}
                                        href="#"
                                        className="text-sm text-gray-400 hover:text-white transition-colors relative group"
                                    >
                                        {item}
                                        <span className="absolute -bottom-1 left-0 w-0 h-0.5 bg-green-400 group-hover:w-full transition-all duration-300" />
                                    </a>
                                ))}
                            </div>

                            <div>
                                <button className={`bg-green-500/20 backdrop-blur-sm hover:bg-green-500/30 text-green-400 border border-green-500/30 rounded-full ${scrolled ? 'px-4 py-2 text-sm' : 'px-6 py-2'}`}>
                                    Přihlásit se
                                </button>
                            </div>
                        </div>
                    </motion.nav>

                    {/* Hero Content */}
                    <div className="relative z-10 text-center px-4 md:px-6 max-w-7xl mx-auto pt-24 md:pt-32 pb-20 md:pb-0">
                        <motion.div
                            initial={{ opacity: 0, y: 30 }}
                            animate={{ opacity: 1, y: 0 }}
                            transition={{ duration: 1, ease: "easeOut" }}
                        >
                            <motion.div 
                                className="inline-flex items-center gap-2 md:gap-3 px-4 md:px-5 py-2 md:py-2.5 rounded-full backdrop-blur-xl bg-black/40 border border-white/20 shadow-2xl mb-6 md:mb-8"
                                initial={{ opacity: 0, scale: 0.8 }}
                                animate={{ opacity: 1, scale: 1 }}
                                transition={{ delay: 0.3, duration: 0.6 }}
                            >
                                <motion.span 
                                    className="w-2.5 h-2.5 rounded-full bg-green-500 shadow-lg shadow-green-500/50"
                                    animate={{ scale: [1, 1.2, 1] }}
                                    transition={{ duration: 2, repeat: Infinity }}
                                />
                                <span className="text-xs md:text-sm text-gray-300">Server je online</span>
                                <span className="text-xs md:text-sm font-bold text-green-400">• {playerCount} hráčů</span>
                            </motion.div>

                            <motion.h1 
                                className="text-4xl sm:text-5xl md:text-7xl lg:text-8xl font-black mb-4 md:mb-6 leading-tight"
                                initial={{ opacity: 0, y: 20 }}
                                animate={{ opacity: 1, y: 0 }}
                                transition={{ delay: 0.5, duration: 0.8 }}
                            >
                                <span className="text-white drop-shadow-2xl">NationCraft.cz</span>
                            </motion.h1>

                            <motion.p 
                                className="text-base md:text-lg lg:text-xl text-white max-w-2xl mx-auto mb-6 md:mb-10 leading-relaxed drop-shadow-lg px-4"
                                initial={{ opacity: 0 }}
                                animate={{ opacity: 1 }}
                                transition={{ delay: 0.6, duration: 0.8 }}
                            >
                                Připoj se k československému Minecraft serveru
                            </motion.p>

                            <motion.div 
                                className="flex justify-center mb-6 md:mb-10"
                                initial={{ opacity: 0, y: 20 }}
                                animate={{ opacity: 1, y: 0 }}
                                transition={{ delay: 0.9, duration: 0.6 }}
                            >
                                <motion.button
                                    onClick={() => copyIP('alpha.argonix.eu:26217')}
                                    className="group flex flex-col sm:flex-row items-center gap-3 md:gap-4 px-6 md:px-8 py-4 md:py-5 rounded-2xl md:rounded-3xl backdrop-blur-xl bg-black/40 border border-white/20 hover:border-green-500/40 hover:bg-black/50 transition-all shadow-2xl w-full sm:w-auto max-w-md sm:max-w-none"
                                    whileHover={{ scale: 1.03, y: -2 }}
                                    whileTap={{ scale: 0.97 }}
                                >
                                    <div className="w-10 h-10 md:w-12 md:h-12 rounded-xl md:rounded-2xl bg-green-500/20 backdrop-blur-sm flex items-center justify-center border border-green-500/30">
                                        <i className="fas fa-gamepad text-green-400 text-lg md:text-xl"></i>
                                    </div>
                                    <div className="text-center sm:text-left flex-1">
                                        <p className="text-xs text-gray-400 mb-1">Server IP • Verze 1.21.7</p>
                                        <p className="font-mono font-bold text-green-400 text-base md:text-lg">alpha.argonix.eu:26217</p>
                                    </div>
                                    <motion.div
                                        animate={{ rotate: copied ? 0 : 0 }}
                                        transition={{ duration: 0.3 }}
                                        className="sm:ml-2"
                                    >
                                        {copied ? (
                                            <i className="fas fa-check text-green-500 text-lg md:text-xl"></i>
                                        ) : (
                                            <i className="fas fa-copy text-gray-500 group-hover:text-green-400 text-base md:text-lg transition-colors"></i>
                                        )}
                                    </motion.div>
                                </motion.button>
                            </motion.div>
                        </motion.div>

                        <motion.div 
                            className="absolute bottom-16 md:bottom-8 left-1/2 -translate-x-1/2"
                            animate={{ y: [0, 12, 0] }}
                            transition={{ duration: 2.5, repeat: Infinity, ease: "easeInOut" }}
                        >
                            <i className="fas fa-chevron-down text-gray-600 text-2xl"></i>
                        </motion.div>
                    </div>
                </section>
            );
        }

        // About Section Component
        function AboutSection() {
            const features = [
                { icon: 'fa-star', title: 'Unikátní zážitek', description: 'Revoluční gameplay na nejnovějších verzích Minecraftu.' },
                { icon: 'fa-users', title: 'Silná komunita', description: 'Přátelští hráči připravení ti pomoct.' },
                { icon: 'fa-bolt', title: 'Bez lagů', description: 'Optimalizované servery pro nejlepší herní výkon.' },
                { icon: 'fa-shield', title: 'Bezpečné hraní', description: 'Anti-cheat a aktivní admin tým 24/7.' }
            ];

            return (
                <section className="relative py-32 px-6">
                    <div className="absolute inset-0 overflow-hidden">
                        <div className="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-white/10 to-transparent" />
                        <div className="absolute bottom-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-white/10 to-transparent" />
                    </div>

                    <div className="max-w-7xl mx-auto">
                        <motion.div
                            initial={{ opacity: 0, y: 20 }}
                            whileInView={{ opacity: 1, y: 0 }}
                            viewport={{ once: true }}
                            className="text-center mb-20"
                        >
                            <span className="inline-block px-5 py-2 rounded-full backdrop-blur-xl bg-white/5 border border-white/10 text-sm text-gray-400 mb-6 shadow-lg">
                                O nás
                            </span>
                            <h2 className="text-4xl md:text-5xl font-black mb-6 text-white">Kdo jsme?</h2>
                            <p className="text-gray-400 max-w-3xl mx-auto text-lg leading-relaxed">
                                Jsme revoluční československý Minecraft projekt. 
                                NationCraft nabízí nejlepší Duely a brzy přidáme další skvělé minihry!
                                Vytváříme komunitu, kde se každý baví naplno.
                            </p>
                        </motion.div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            {features.map((feature, index) => (
                                <motion.div
                                    key={feature.title}
                                    initial={{ opacity: 0, y: 20 }}
                                    whileInView={{ opacity: 1, y: 0 }}
                                    viewport={{ once: true }}
                                    transition={{ delay: index * 0.15, duration: 0.6, ease: "easeOut" }}
                                    whileHover={{ y: -8, transition: { duration: 0.3 } }}
                                    className="group relative p-8 rounded-3xl backdrop-blur-xl bg-white/5 border border-white/10 hover:border-green-500/30 hover:bg-white/10 transition-all duration-500 shadow-2xl"
                                >
                                    <div className="w-16 h-16 rounded-2xl backdrop-blur-sm bg-green-500/10 border border-green-500/20 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform duration-500">
                                        <i className={`fas ${feature.icon} text-green-400 text-2xl`}></i>
                                    </div>
                                    <h3 className="text-xl font-bold text-white mb-3 group-hover:text-green-400 transition-colors duration-300">{feature.title}</h3>
                                    <p className="text-gray-400 leading-relaxed">{feature.description}</p>
                                </motion.div>
                            ))}
                        </div>

                        <motion.div
                            initial={{ opacity: 0, y: 20 }}
                            whileInView={{ opacity: 1, y: 0 }}
                            viewport={{ once: true }}
                            transition={{ delay: 0.4, duration: 0.6 }}
                            className="mt-20 grid grid-cols-2 md:grid-cols-4 gap-8"
                        >
                            {[
                                { value: '99.9%', label: 'Uptime serveru' },
                                { value: '24/7', label: 'Podpora' },
                                { value: '0ms', label: 'Průměrný ping' },
                                { value: 'Nové', label: 'Minihry brzy' }
                            ].map((stat, index) => (
                                <motion.div 
                                    key={stat.label} 
                                    className="text-center p-6 rounded-2xl backdrop-blur-xl bg-white/5 border border-white/10"
                                    initial={{ opacity: 0, scale: 0.9 }}
                                    whileInView={{ opacity: 1, scale: 1 }}
                                    viewport={{ once: true }}
                                    transition={{ delay: 0.5 + index * 0.1, duration: 0.5 }}
                                    whileHover={{ scale: 1.05, transition: { duration: 0.2 } }}
                                >
                                    <div className="text-3xl md:text-4xl font-black text-green-400 mb-2">{stat.value}</div>
                                    <div className="text-sm text-gray-500">{stat.label}</div>
                                </motion.div>
                            ))}
                        </motion.div>
                    </div>
                </section>
            );
        }

        // Game Modes Section
        function GameModesSection() {
            const gameModes = [
                {
                    id: 'duels',
                    icon: 'fa-gamepad',
                    name: 'Duely',
                    status: 'Dostupné nyní',
                    description: 'Prokáž své dovednosti v napínavých 1v1 soubojích! Různé režimy a mapy pro nekončící zábavu.',
                    features: ['1v1 boje', 'Žebříčky', 'Různé módy', 'Rankované zápasy'],
                    image: 'https://cdn.discordapp.com/attachments/1445486597578555646/1456755227440185364/IMG_2819.png?ex=69598487&is=69583307&hm=f3fc057bd41298b86b26c8d9f3f161ed496034327717292ec9625801c2fb58b0&'
                },
                {
                    id: 'coming-soon',
                    icon: 'fa-plus',
                    name: 'Nové minihry',
                    status: 'Již brzy',
                    description: 'Připravujeme pro tebe další úžasné minihry! Sleduj naše sociální sítě pro nejnovější informace.',
                    features: ['BedWars', 'SkyWars', 'SurvivalGames', 'A mnoho dalšího...'],
                    image: 'https://cdn.discordapp.com/attachments/1445486597578555646/1456755226953519295/IMG_2817.png?ex=69598487&is=69583307&hm=ed3b6811498a765b6181102aff942db03f03c349b31c5024819dde5ee9778c75&',
                    comingSoon: true
                }
            ];

            return (
                <section className="relative py-32 px-6">
                    <div className="max-w-7xl mx-auto">
                        <motion.div
                            initial={{ opacity: 0, y: 20 }}
                            whileInView={{ opacity: 1, y: 0 }}
                            viewport={{ once: true }}
                            transition={{ duration: 0.6 }}
                            className="text-center mb-16"
                        >
                            <span className="inline-block px-5 py-2 rounded-full backdrop-blur-xl bg-white/5 border border-white/10 text-sm text-gray-400 mb-6 shadow-lg">
                                Herní módy
                            </span>
                            <h2 className="text-4xl md:text-5xl font-black mb-6 text-white">Co u nás najdeš?</h2>
                        </motion.div>

                        <div className="grid lg:grid-cols-2 gap-8">
                            {gameModes.map((mode, index) => (
                                <motion.div
                                    key={mode.id}
                                    initial={{ opacity: 0, y: 30 }}
                                    whileInView={{ opacity: 1, y: 0 }}
                                    viewport={{ once: true }}
                                    transition={{ delay: index * 0.2, duration: 0.6, ease: "easeOut" }}
                                    whileHover={{ y: -8, transition: { duration: 0.3 } }}
                                    className="relative group"
                                >
                                    <div className="relative rounded-3xl overflow-hidden backdrop-blur-xl bg-white/5 border border-white/10 hover:border-green-500/30 transition-all duration-500 shadow-2xl">
                                        <div className="relative h-64 md:h-80 overflow-hidden">
                                            <motion.img 
                                                src={mode.image}
                                                alt={mode.name}
                                                className="w-full h-full object-cover"

                                                transition={{ duration: 0.6 }}

                                                    className={`flex items-center gap-2 px-4 py-2 rounded-full backdrop-blur-xl shadow-lg ${

                                                            ? 'bg-yellow-500/20 border border-yellow-500/30' 
                                                            : 'bg-green-500/20 border border-green-500/30'
                                                    }`}

                                                    whileInView={{ scale: 1, opacity: 1 }}
                                                    viewport={{ once: true }}

                                                        <>
                                                            <motion.span 
                                                                className="w-2 h-2 rounded-full bg-green-500
